name: Android CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "47 18 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "Compatibility lane"
        required: true
        default: main
        type: choice
        options:
          - main
          - staging
          - nightly
          - release

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-and-build:
    name: policy-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify source policies
        run: |
          set -euo pipefail
          # Computed, not listed. A hand-maintained list goes stale the first
          # time somebody adds a contract and forgets, and the failure is silent
          # in the worst direction: a test that never runs looks exactly like a
          # test that passes. This repository proved it -- the signing
          # continuity contract sat here written, committed and never invoked
          # until somebody noticed it was missing from these three lines.
          #
          # The Client has globbed for a while. This is the same selector.
          shopt -s nullglob
          contracts=(scripts/test_*.py)
          if [ ${#contracts[@]} -eq 0 ]; then
              echo "::error::No source contracts were found; the selector is broken."
              exit 1
          fi
          printf 'running %d contracts\n' "${#contracts[@]}"
          for contract in "${contracts[@]}"; do
              echo "--- $contract"
              python3 "$contract"
          done
          python3 scripts/check_log_policy.py
      - name: Unit tests and DEV debug build
        run: ./gradlew --no-daemon :app:testDevDebugUnitTest :app:assembleDevDebug :app:assembleDevDebugAndroidTest

  compatibility:
    name: compatibility-api-${{ matrix.api }}
    needs: policy-and-build
    if: >-
      github.event_name != 'pull_request' &&
      !(github.event_name == 'workflow_dispatch' && github.event.inputs.lane == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON((github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || github.event.inputs.lane == 'nightly' || github.event.inputs.lane == 'release') && '[24,35]' || '[35]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build DEV test APKs
        run: ./gradlew --no-daemon :app:assembleDevDebug :app:assembleDevDebugAndroidTest
      - name: Run Admin compatibility checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          script: sh scripts/run_emulator_compatibility.sh "com.am2.admin.dev"

  staging-artifact:
    name: staging-artifact
    needs: policy-and-build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.lane == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      # One key across every staging build, so a handset can be updated in
      # place. Without it each runner generates its own throwaway debug key and
      # the field pays an uninstall per round. The keystore arrives as base64
      # because a secret is text, and is written to RUNNER_TEMP rather than the
      # workspace so no packaging step can pick it up.
      - name: Restore the staging signing key
        id: staging_key
        env:
          KEYSTORE_BASE64: ${{ secrets.AM2_STAGING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::no staging keystore configured; this APK cannot be installed over the previous one"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/staging.jks"
          echo "path=${RUNNER_TEMP}/staging.jks" >> "$GITHUB_OUTPUT"
      # Passed as ORG_GRADLE_PROJECT_* rather than -P: Gradle reads those as
      # project properties, and a password on the command line is visible in
      # the process list to anything else running on the machine.
      #
      # All four empty is the unconfigured case and builds normally. Some but
      # not all is a misconfiguration, and build.gradle.kts stops on it by name
      # rather than quietly signing with the runner's own debug key.
      - name: Build staging debug candidate
        env:
          ORG_GRADLE_PROJECT_AM2_STAGING_KEYSTORE_FILE: ${{ steps.staging_key.outputs.path }}
          ORG_GRADLE_PROJECT_AM2_STAGING_KEYSTORE_PASSWORD: ${{ secrets.AM2_STAGING_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_AM2_STAGING_KEY_ALIAS: ${{ secrets.AM2_STAGING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_AM2_STAGING_KEY_PASSWORD: ${{ secrets.AM2_STAGING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PAM2_VERSION_CODE="$GITHUB_RUN_NUMBER" :app:testStagingDebugUnitTest :app:assembleStagingDebug
      - name: Record staging artifact identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/staging/debug -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          mkdir -p staging-artifact
          cp "$APK" staging-artifact/am2-admin-staging-debug.apk
          (
            cd staging-artifact
            sha256sum am2-admin-staging-debug.apk > SHA256SUMS
          )
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging staging-artifact/am2-admin-staging-debug.apk > staging-artifact/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs staging-artifact/am2-admin-staging-debug.apk > staging-artifact/signer-metadata.txt
          stat --printf='byte_size=%s\n' staging-artifact/am2-admin-staging-debug.apk > staging-artifact/build-metadata.txt
          printf 'source_commit=%s\nenvironment=staging\nvariant=StagingDebug\napi_range=24+\n' "$GITHUB_SHA" >> staging-artifact/build-metadata.txt
      # The file the panel serves, written from the build that just produced
      # the APK rather than by hand. Every value comes from aapt, apksigner or
      # the commit; the server compares key sets and refuses the whole manifest
      # on one field out of place, which is how this channel went dead.
      - name: Write the update manifest
        run: |
          set -euo pipefail
          python3 scripts/write_update_manifest.py \
            --apk staging-artifact/am2-admin-staging-debug.apk \
            --badging staging-artifact/apk-badging.txt \
            --signer staging-artifact/signer-metadata.txt \
            --build-metadata staging-artifact/build-metadata.txt \
            --release-notes app/release-notes.json \
            --update-base https://staging-webadmin.am2-poc.com/update \
            --out staging-artifact/admin_version.json
      - name: Upload staging candidate only
        uses: actions/upload-artifact@v4
        with:
          name: am2-admin-staging-debug-${{ github.sha }}
          path: staging-artifact/
          if-no-files-found: error
          retention-days: 3

  release-artifact:
    name: release-artifact
    needs: compatibility
    # The ref check lives here rather than in a deployment branch policy on the
    # `android-release` environment. That policy allowed main and v* and was the
    # only thing stopping a dispatched release from an arbitrary branch -- the
    # condition below used to accept any ref for lane=release. GitHub ignores
    # environment protection rules outright on a private repository under Free,
    # so the policy would have gone quiet without failing anything, leaving a
    # line that looked like a guard. Conditions are read from the workflow file
    # at the commit being run, and that does not depend on the plan.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.lane == 'release'
          && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      # Written to RUNNER_TEMP, never the workspace -- the artifact upload step
      # below globs a directory, and a key inside it would be published.
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.AM2_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "AM2_UPLOAD_KEYSTORE_BASE64 is not set; a release cannot be signed" >&2
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/upload.jks"
      - name: Full tests and signed production APK
        env:
          AM2_APPROVED_SIGNER_SHA256: ${{ vars.AM2_APPROVED_SIGNER_SHA256 }}
          ORG_GRADLE_PROJECT_AM2_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_AM2_KEYSTORE_PASSWORD: ${{ secrets.AM2_UPLOAD_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_AM2_KEY_ALIAS: ${{ secrets.AM2_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_AM2_KEY_PASSWORD: ${{ secrets.AM2_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$AM2_APPROVED_SIGNER_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep -Ec '^[0-9a-f]{64}$')" -eq 1
          ./gradlew --no-daemon :app:test :app:assembleProductionRelease \
            -PAM2_APPROVED_SIGNER_SHA256="$AM2_APPROVED_SIGNER_SHA256" \
            -PAM2_VERSION_CODE="$GITHUB_RUN_NUMBER"
      - name: Record artifact identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/production/release -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          mkdir -p release-artifact
          cp "$APK" release-artifact/am2-admin-production.apk
          sha256sum release-artifact/am2-admin-production.apk > release-artifact/am2-admin-production.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release-artifact/am2-admin-production.apk > release-artifact/apk-badging.txt
          stat --printf='byte_size=%s\n' release-artifact/am2-admin-production.apk > release-artifact/build-metadata.txt
          # A failure here stops the lane. It used to record signed=false and
          # upload anyway, which publishes something Play refuses and no
          # handset can install over.
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            release-artifact/am2-admin-production.apk > release-artifact/signer-metadata.txt
          printf 'signed=true\n' >> release-artifact/signer-metadata.txt
          printf 'source_commit=%s\nenvironment=production\n' "$GITHUB_SHA" >> release-artifact/build-metadata.txt
      - name: Write the update manifest
        run: |
          set -euo pipefail
          python3 scripts/write_update_manifest.py \
            --apk release-artifact/am2-admin-production.apk \
            --badging release-artifact/apk-badging.txt \
            --signer release-artifact/signer-metadata.txt \
            --build-metadata release-artifact/build-metadata.txt \
            --release-notes app/release-notes.json \
            --update-base https://webadmin.am2-poc.com/update \
            --out release-artifact/admin_version.json
      - name: Upload release candidate only
        uses: actions/upload-artifact@v4
        with:
          name: am2-admin-release-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 3
