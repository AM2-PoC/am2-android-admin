# The Admin app's marketing version, in one place.
#
# It was the literal "1.1.0" in build.gradle.kts. versionCode already came from
# CI, so nothing tied the number a handset reports to the number the panel
# announces in admin_version.json -- they matched by hand, and only by luck.
#
# A properties file rather than a Kotlin literal because CI has to read it to
# write that manifest, and grepping a build script for a quoted string is not a
# contract. Gradle reads it here; -PAM2_VERSION_NAME overrides it.
#
# The flavour appends its own suffix: -dev, -staging, or nothing for production.
versionName=1.1.0
